<meta charset="utf-8">
<title>Assistant, drawer open</title>
<meta name="viewport" content="width=430, initial-scale=1">
<style>
	* { box-sizing: border-box; }
	body {
		margin: 0; width: 430px; height: 932px; position: relative; overflow: hidden;
		background: #141218; color: #E6E0E9;
		font-family: system-ui, Roboto, sans-serif; font-size: 14px;
		-webkit-font-smoothing: antialiased;
	}
	.status { height: 28px; padding: 6px 18px; font-size: 12px; color: #CAC4D0; display: flex; }
	.status span:last-child { margin-left: auto; }
	.bar { height: 64px; display: flex; align-items: center; padding: 0 6px; gap: 6px; }
	.ib { width: 44px; height: 44px; display: grid; place-items: center; color: #CAC4D0; font-size: 20px; }
	.title { font-size: 20px; }
	.chips { display: flex; gap: 8px; padding: 0 16px 10px; border-bottom: 1px solid #49454F; }
	.wchip { height: 32px; display: flex; align-items: center; padding: 0 12px; border-radius: 8px; border: 1px solid #938F99; font-size: 13px; }
	.msg { margin: 10px 12px; padding: 10px 12px; border-radius: 14px; background: #1D1B20; font-size: 13.5px; line-height: 1.45; max-width: 330px; }
	.msg.me { margin-left: auto; background: #4A4458; }
	.composer { position: absolute; left: 12px; right: 12px; bottom: 16px; height: 52px; border-radius: 26px; background: #2B2930; }

	.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.5); }
	.drawer {
		position: absolute; top: 0; right: 0; bottom: 0; width: 304px;
		background: #1D1B20; border-radius: 16px 0 0 16px; padding: 40px 12px 16px;
	}
	.dh { padding: 4px 16px 14px; }
	.dn { font-size: 16px; font-weight: 600; }
	.ds { font-size: 11.5px; color: #948F9A; margin-top: 4px; font-family: ui-monospace, monospace; }
	.item { height: 50px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-radius: 25px; font-size: 14.5px; color: #CAC4D0; }
	.item .g { width: 22px; text-align: center; font-size: 17px; }
	.item .n { flex: 1; }
	.item.on { background: #4A4458; color: #E8DEF8; font-weight: 600; }

	.note { position: absolute; left: 12px; width: 110px; top: 380px; background: #2B2930; border: 1px dashed #605B68; border-radius: 12px; padding: 10px 11px; color: #CAC4D0; font-size: 12px; line-height: 1.45; }
</style>

<div class="status"><span>9:41</span><span>5G &#9646;&#9646;&#9646;</span></div>
<div class="bar">
	<div class="ib">&#8592;</div>
	<div class="title">Assistant</div>
	<div style="flex:1"></div>
	<div class="ib">&#9002;</div>
	<div class="ib">&#9881;</div>
	<div class="ib">&#9776;</div>
</div>
<div class="chips"><div class="wchip">GitHub notifications &#183; 3 unread</div></div>
<div class="msg">Two review requests overnight, both on switchboard.</div>
<div class="msg me">mark the dependabot ones done</div>
<div class="composer"></div>

<div class="scrim"></div>
<div class="drawer">
	<div class="dh">
		<div class="dn">Assistant</div>
		<div class="ds">sakura.host.assistant</div>
	</div>
	<div class="item on"><span class="g">&#9993;</span><span class="n">Chat</span></div>
	<div class="item"><span class="g">&#9002;</span><span class="n">Terminal</span></div>
</div>

<div class="note">Chat and Terminal only. No Files, no HERE views. Back from Terminal goes to Chat.</div>
