name: Workflow Call - Build & Release Android APK

on:
  workflow_call:
    inputs:
      create_release:
        description: "Create/refresh the single latest GitHub Release with the APK"
        type: boolean
        required: true

jobs:
  build-android:
    name: ${{ inputs.create_release && 'Build & Release APK' || 'Build APK' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships the SDK, so this is for the env and the licences. The action's default
      # package list asks for `tools`, which the SDK repository no longer carries.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      # Decode the stable signing keystore so every release shares one signature.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/switchboard.keystore"
            echo "have_keystore=true" >> "$GITHUB_ENV"
          else
            echo "have_keystore=false" >> "$GITHUB_ENV"
          fi

      # A shipped release must be signed: an unsigned assembleRelease emits
      # app-release-unsigned.apk, so the upload + release steps would reference a
      # release/switchboard-release.apk that does not exist and fail with a misleading
      # "file not found". Fail on the real cause instead.
      - name: Require keystore when releasing
        if: ${{ fromJSON(inputs.create_release) && env.have_keystore != 'true' }}
        run: |
          echo "::error::create_release is set but ANDROID_KEYSTORE_BASE64 is unset; assembleRelease would emit an unsigned APK and the release path would not exist."
          exit 1

      # Red unit tests (incl. the golden protocol fixtures shared with vitest)
      # must fail the run before any artifact builds.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      # One code for both APKs; phone-install.sh raises the offset.
      - name: Stamp version code
        env:
          RUN_NUMBER: ${{ github.run_number }}
          OFFSET: ${{ vars.ANDROID_VERSION_OFFSET || '0' }}
        run: |
          case "$OFFSET" in
            ''|*[!0-9]*) echo "::error::ANDROID_VERSION_OFFSET is not a whole number: $OFFSET"; exit 1 ;;
          esac
          echo "ANDROID_VERSION_CODE=$((RUN_NUMBER + OFFSET))" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.have_keystore == 'true' && format('{0}/switchboard.keystore', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Build debug APK
        # Sign the debug build with the SAME stable key as release. Android refuses
        # to install an APK over one with the same package but a different signature,
        # so sharing the key makes the debug build a one-tap side-step from the
        # release build (and back) when chasing an issue. The `debug` signingConfig
        # reads the same ANDROID_KEYSTORE_* env as `release`.
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.have_keystore == 'true' && format('{0}/switchboard.keystore', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Upload release APK as artifact
        uses: actions/upload-artifact@v7
        with:
          name: switchboard-release-apk
          path: android/app/build/outputs/apk/release/switchboard-release.apk
          retention-days: 7

      - name: Upload debug APK as artifact
        uses: actions/upload-artifact@v7
        with:
          name: switchboard-debug-apk
          path: android/app/build/outputs/apk/debug/switchboard-debug.apk
          retention-days: 7

      # One release at a fixed tag, moved to this build. Every call retries, the upload replaces,
      # and the step passes once the release holds both APKs: a transient after the upload is not
      # a failed build, and no moment exists in which the release is gone.
      - name: Create Release
        if: ${{ fromJSON(inputs.create_release) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          retry() {
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              echo "attempt $attempt failed: $*" >&2
              sleep $((attempt * 15))
            done
            return 1
          }
          release="android/app/build/outputs/apk/release/switchboard-release.apk"
          debug="android/app/build/outputs/apk/debug/switchboard-debug.apk"
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<'NOTES'
          Switchboard Android app, built from ${{ github.sha }}.

          **switchboard-release.apk** - production build, signed with the stable release key.
          Updates install over each other. Install this one manually once; after it,
          in-app updates resume. Sideload: `adb install -r switchboard-release.apk`

          **switchboard-debug.apk** - debug build with ingest log streaming to the Federation Router,
          signed with the SAME stable key as the release, so it installs straight
          over the release build (and back) for a one-tap side-step to debug.
          Sideload: `adb install -r switchboard-debug.apk`
          NOTES
          retry git push --force origin "HEAD:refs/tags/android-app" || echo "tag not moved; the notes name the build" >&2
          if gh release view android-app >/dev/null 2>&1; then
            retry gh release edit android-app --title "Switchboard Android (latest)" --notes-file "$notes" --latest
          else
            retry gh release create android-app --title "Switchboard Android (latest)" --notes-file "$notes" --latest --target "${{ github.sha }}"
          fi
          retry gh release upload android-app --clobber "$release" "$debug"
          held=$(retry gh release view android-app --json assets --jq '[.assets[].name | select(test("^switchboard-(release|debug)\\.apk$"))] | length')
          test "$held" = "2"
